<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Radio - Futuristic UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-color: #004cff; 
            --accent-color: #bc13fe;
            --bg-glow: rgba(0, 255, 255, 0.1);
        }
        body.theme-pink { --main-color: #ff1493; --accent-color: #00ffff; --bg-glow: rgba(255, 20, 147, 0.1); }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            height: 100vh;
            /* Fond spatial "Deep Blue" pour faire ressortir le logo blanc sans être noir pur */
            background: radial-gradient(circle at 50% 50%, #0a1a2a 0%, #000000 100%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* --- Atmosphère (Pas de boîte noire, juste des lumières) --- */
        .glow-bg {
            position: fixed;
            width: 600px; height: 600px;
            background: radial-gradient(circle, var(--bg-glow) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            transition: background 0.5s;
        }
        .is-playing .glow-bg { animation: pulse-bg 2s infinite alternate; }
        @keyframes pulse-bg { from { transform: scale(1); opacity: 0.5; } to { transform: scale(1.2); opacity: 1; } }

        /* --- Container Principal --- */
        .player-core {
            position: relative;
            width: 90vw;
            max-width: 700px;
            z-index: 10;
        }

        /* --- SVG Styling --- */
        .freedom-svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
            cursor: pointer;
            transition: filter 0.3s;
            position: relative;
            z-index: 2;
        }
        .freedom-svg:hover { filter: drop-shadow(0 0 10px var(--main-color)); }
        
        /* Classes injectées dans le SVG via CSS */
        .svg-shadow { fill: #000000; opacity: 0.4; transition: fill 0.3s; }
        .svg-text { fill: #f7f7fb; transition: fill 0.3s; }
        
        /* L'oiseau prend la couleur dynamique */
        .svg-bird { 
            fill: var(--main-color); 
            transition: fill 0.3s, filter 0.3s;
            filter: drop-shadow(0 0 5px var(--main-color));
        }

        /* Animation de l'oiseau */
        .is-playing .svg-bird {
            animation: bird-pulse 1.5s infinite alternate;
        }
        @keyframes bird-pulse {
            0% { opacity: 0.8; filter: drop-shadow(0 0 5px var(--main-color)); }
            100% { opacity: 1; filter: drop-shadow(0 0 20px var(--main-color)); }
        }

        /* --- Indicateur Central (Play) --- */
        .play-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
            z-index: 3;
            pointer-events: none;
        }
        .play-indicator::after {
            content: '';
            border-left: 15px solid #fff;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            margin-left: 4px;
            transition: all 0.2s;
        }
        .is-playing .play-indicator {
            opacity: 0; transform: translate(-50%, -50%) scale(0);
        }

        /* --- Contrôles Orbitaux --- */
        .orbit-control {
            position: absolute;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            z-index: 20;
        }
        .orbit-control:hover {
            border-color: var(--main-color);
            color: var(--main-color);
            box-shadow: 0 0 15px var(--main-color);
        }

        /* Positions */
        .ctrl-volume { bottom: -50px; left: 50%; transform: translateX(-50%); width: 180px; }
        .ctrl-station { top: 50%; right: -80px; transform: translateY(-50%); flex-direction: column; }
        .ctrl-theme { top: -40px; left: 50%; transform: translateX(-50%); }

        /* Inputs */
        input[type=range] {
            -webkit-appearance: none;
            width: 80px; height: 2px;
            background: rgba(255,255,255,0.2);
            outline: none; border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px var(--main-color);
        }

        audio { display: none; }
    </style>
</head>

        <div class="play-indicator"></div>

        <!-- Contrôles -->
        <div class="orbit-control ctrl-volume">
            <span>VOL</span>
            <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.8">
        </div>

        <div class="orbit-control ctrl-station" id="stationBtn">
            <span id="stationLabel">CH 1</span>
        </div>

        <div class="orbit-control ctrl-theme" id="themeBtn">
            <span>◈ THEME</span>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const audioSource = document.getElementById('audioSource');
        const mainPlayer = document.getElementById('mainPlayer');
        const logoBtn = document.getElementById('logoBtn');
        const stationBtn = document.getElementById('stationBtn');
        const stationLabel = document.getElementById('stationLabel');
        const themeBtn = document.getElementById('themeBtn');
        const volumeControl = document.getElementById('volumeControl');

        let stationIndex = 0;
        const stations = [
            { url: 'https://freedomice.streamakaci.com/freedom.mp3', name: 'CH 1' },
            { url: 'https://freedomice.streamakaci.com/freedom2.mp3', name: 'CH 2' }
        ];

        logoBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                mainPlayer.classList.add('is-playing');
            } else {
                audio.pause();
                mainPlayer.classList.remove('is-playing');
            }
        });

        volumeControl.addEventListener('input', (e) => audio.volume = e.target.value);

        stationBtn.addEventListener('click', () => {
            stationIndex = (stationIndex + 1) % stations.length;
            const station = stations[stationIndex];
            audioSource.src = station.url;
            audio.load();
            stationLabel.textContent = station.name;
            if(mainPlayer.classList.contains('is-playing')) audio.play();
        });

        themeBtn.addEventListener('click', () => document.body.classList.toggle('theme-pink'));
    </script>
